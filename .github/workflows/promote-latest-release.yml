name: Promote latest release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read current app version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish current changelog notes and mark release as latest
        if: github.event.workflow_run.head_branch == format('v{0}', steps.version.outputs.value)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          release_notes="$(awk -v version="$APP_VERSION" '
            index($0, "## [" version "] -") == 1 || $0 == "## [" version "]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "$release_notes" ]]; then
            echo "No changelog section found for v$APP_VERSION" >&2
            exit 1
          fi
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          marker="### Changes in v$APP_VERSION"
          if [[ "$body" != *"$marker"* ]]; then
            {
              printf '%s\n\n' "$body"
              printf '%s\n\n%s\n' "$marker" "$release_notes"
            } > "$RUNNER_TEMP/release-notes.md"
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease=false --latest --verify-tag
          else
            gh release edit "$RELEASE_TAG" --prerelease=false --latest --verify-tag
          fi
