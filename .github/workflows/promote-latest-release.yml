name: Promote latest release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    # A tag push promotes its own release; a main push promotes only the
    # release it created for an untagged version bump (see ci.yml).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (startsWith(github.event.workflow_run.head_branch, 'v') ||
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read current app version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve the release this run published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          promote=false
          if [[ "$HEAD_BRANCH" == "$tag" ]]; then
            promote=true
          elif [[ "$HEAD_BRANCH" == "main" ]]; then
            tagged_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null || true)"
            if [[ "$tagged_sha" == "$HEAD_SHA" ]] && gh release view "$tag" >/dev/null 2>&1; then
              promote=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

      - name: Publish current changelog notes and mark release as latest
        if: steps.release.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          release_notes="$(awk -v version="$APP_VERSION" '
            index($0, "## [" version "] -") == 1 || $0 == "## [" version "]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "$release_notes" ]]; then
            echo "No changelog section found for v$APP_VERSION" >&2
            exit 1
          fi
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          marker="### Changes in v$APP_VERSION"
          if [[ "$body" != *"$marker"* ]]; then
            {
              printf '%s\n\n' "$body"
              printf '%s\n\n%s\n' "$marker" "$release_notes"
            } > "$RUNNER_TEMP/release-notes.md"
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease=false --latest --verify-tag
          else
            gh release edit "$RELEASE_TAG" --prerelease=false --latest --verify-tag
          fi
